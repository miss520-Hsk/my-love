<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小凯大人的神秘商店</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#f6f8fc;color:#1e293b;padding:1.5rem;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
h1{font-size:1.8rem;font-weight:600;background:linear-gradient(145deg,#0f172a,#334155);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cart-btn{background:#fff;border:1px solid #e2e8f0;padding:.7rem 1.4rem;border-radius:100px;display:flex;align-items:center;gap:.5rem;font-weight:500;cursor:pointer;transition:.2s;font-size:.95rem;color:#1e293b}
.cart-btn:hover{background:#f1f5f9}
.cart-count{background:#0f172a;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem}
.product-card{background:#fff;border-radius:1.5rem;box-shadow:0 8px 18px rgba(0,0,0,.02),0 2px 6px rgba(0,0,0,.03);overflow:hidden;transition:.2s;display:flex;flex-direction:column;border:1px solid #edf2f7}
.product-card:hover{transform:translateY(-3px);box-shadow:0 20px 30px -10px rgba(0,0,0,.1)}
.media-preview{height:170px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #eef2f6;position:relative}
.media-preview img,.media-preview video{width:100%;height:100%;object-fit:cover;display:block}
.video-indicator{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;border-radius:30px;font-size:.7rem;display:flex;gap:4px;align-items:center}
.no-media{color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.9rem}
.no-media i{font-size:2rem}
.product-info{padding:1rem 1.2rem 1.2rem;flex:1;display:flex;flex-direction:column}
.product-name{font-weight:600;font-size:1.1rem;margin-bottom:.3rem}
.product-desc{font-size:.85rem;color:#475569;line-height:1.4;margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.price{font-weight:700;font-size:1.2rem}
.add-btn{background:#0f172a;color:#fff;border:none;padding:.5rem 1rem;border-radius:40px;font-weight:500;font-size:.85rem;cursor:pointer;display:flex;gap:.4rem;align-items:center;transition:.15s}
.add-btn:hover{background:#1e293b}
.empty{grid-column:1/-1;text-align:center;padding:3rem;color:#94a3b8}
.empty i{font-size:2.5rem;display:block;margin-bottom:10px}
.drawer{position:fixed;top:0;right:-420px;width:400px;max-width:100%;height:100vh;background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.1);transition:.3s;z-index:1000;display:flex;flex-direction:column;padding:1.5rem}
.drawer.open{right:0}
.drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;padding-bottom:1rem;border-bottom:2px solid #f1f5f9}
.drawer-header h2{font-size:1.2rem}
.close-btn{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#94a3b8;padding:4px}
.close-btn:hover{color:#0f172a}
.cart-list{flex:1;overflow-y:auto;list-style:none}
.cart-list li{display:flex;justify-content:space-between;align-items:center;padding:.8rem 0;border-bottom:1px solid #f1f5f9;gap:8px}
.item-info{flex:1;min-width:0}
.item-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.item-price{font-size:.78rem;color:#94a3b8}
.item-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{background:#f1f5f9;border:none;width:24px;height:24px;border-radius:6px;cursor:pointer;font-weight:700;color:#475569;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.qty-btn:hover{background:#e2e8f0}
.qty{min-width:20px;text-align:center;font-weight:600;font-size:.85rem}
.rm-btn{background:none;border:none;color:#ef4444;cursor:pointer;width:26px;height:26px;border-radius:50%;font-size:.8rem}
.rm-btn:hover{background:#fee2e2}
.empty-cart{color:#94a3b8;font-size:.85rem;font-style:italic;text-align:center;padding:2rem 0}
.cart-total{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;padding:1rem 0;margin-top:auto;border-top:2px solid #e2e8f0}
.checkout-btn{width:100%;background:#0f172a;color:#fff;border:none;padding:.9rem;border-radius:3rem;font-weight:600;font-size:1rem;cursor:pointer;transition:.15s}
.checkout-btn:hover{background:#1e293b}
.checkout-btn:disabled{background:#cbd5e1;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:1100;padding:1rem}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:1.5rem;padding:1.5rem;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.modal h2{font-size:1.3rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.order-summary{background:#f8fafc;border-radius:1rem;padding:1rem;margin:1rem 0;font-size:.85rem}
.order-summary .line{display:flex;justify-content:space-between;padding:.25rem 0;color:#475569}
.order-summary .line.total{font-weight:700;font-size:1rem;color:#0f172a;margin-top:.5rem;padding-top:.5rem;border-top:1px solid #e2e8f0}
.modal-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.2rem}
.btn{padding:.7rem 1.4rem;border-radius:2rem;border:none;font-weight:600;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:.4rem}
.btn-primary{background:#0f172a;color:#fff}
.btn-primary:hover{background:#1e293b}
.btn-success{background:#059669;color:#fff}
.btn-success:hover{background:#047857}
.btn-secondary{background:#f1f5f9;color:#475569}
.btn-secondary:hover{background:#e2e8f0}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:.75rem 2rem;border-radius:50px;font-size:.9rem;box-shadow:0 10px 25px rgba(0,0,0,.2);opacity:0;transition:.2s;pointer-events:none;z-index:2000;max-width:90%}
.toast.show{opacity:1}
.toast.error{background:#b91c1c}
.toast.success{background:#059669}
.success-box{text-align:center;padding:1rem 0}
.success-icon{width:80px;height:80px;border-radius:50%;background:#d1fae5;color:#059669;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:2.5rem}
.success-box h2{font-size:1.4rem;justify-content:center;margin-bottom:.6rem;color:#0f172a}
.success-box p{font-size:.9rem;color:#475569;line-height:1.6;margin-bottom:.4rem}
.success-detail{background:#f8fafc;border-radius:1rem;padding:1rem;margin:1.2rem 0;font-size:.82rem;text-align:left;color:#64748b;line-height:1.6}
.success-detail b{color:#0f172a}
@media(max-width:600px){
  .drawer{width:100%;right:-100%}
  h1{font-size:1.4rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><i class="fas fa-store"></i> 小凯大人的神秘商店</h1>
    <button class="cart-btn" id="openCartBtn">
      <i class="fas fa-shopping-bag"></i> 购物车
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>
  <div class="product-grid" id="productGrid"></div>
</div>

<div class="drawer" id="cartDrawer">
  <div class="drawer-header">
    <h2><i class="fas fa-shopping-cart"></i> 购物车</h2>
    <button class="close-btn" id="closeCartBtn"><i class="fas fa-times"></i></button>
  </div>
  <ul class="cart-list" id="cartList"></ul>
  <div class="cart-total"><span>总计</span><span id="cartTotal">¥0.00</span></div>
  <button class="checkout-btn" id="checkoutBtn"><i class="fas fa-credit-card"></i> 去结算</button>
</div>

<div class="overlay" id="checkoutOverlay">
  <div class="modal" id="checkoutModal">
    <!-- 第一步：确认订单 -->
    <div id="checkoutStep1">
      <h2><i class="fas fa-receipt"></i> 确认订单</h2>
      <div class="order-summary" id="orderSummary"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelCheckout">取消</button>
        <button type="button" class="btn btn-success" id="submitOrderBtn"><i class="fas fa-paper-plane"></i> 提交订单</button>
      </div>
    </div>

    <!-- 第二步：下单成功 -->
    <div id="checkoutStep2" style="display:none;">
      <div class="success-box">
        <div class="success-icon">
          <i class="fas fa-check"></i>
        </div>
        <h2>下单成功！</h2>
        <p>我们已经收到您的订单</p>
        <p><strong>小凯大人竭诚为你服务</strong></p>
        <div class="success-detail" id="successDetail"></div>
        <div class="modal-actions" style="justify-content:center;">
          <button type="button" class="btn btn-primary" id="closeFinal"><i class="fas fa-check"></i> 好的</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  // =====================================================
  // ★ Access Key 已填好，无需修改 ★
  // =====================================================
  const WEB3FORMS_ACCESS_KEY = '09dfed4b-a805-427b-80c1-8c6b60c7bec3';

  // =====================================================

  let cloudProducts = [];
  let cart = [];

  const $ = id => document.getElementById(id);
  const productGrid = $('productGrid');
  const cartCount = $('cartCount');
  const cartList = $('cartList');
  const cartTotal = $('cartTotal');
  const cartDrawer = $('cartDrawer');
  const checkoutOverlay = $('checkoutOverlay');
  const orderSummary = $('orderSummary');

  function esc(s){const d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}
  function toast(msg,dur=2200,type=''){
    const t=$('toast');
    t.textContent=msg;t.className='toast show '+type;
    clearTimeout(window._tt);
    window._tt=setTimeout(()=>t.className='toast',dur);
  }

  async function loadProducts(){
    try{
      const r=await fetch('products.json?t='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw new Error('加载失败');
      const d=await r.json();
      cloudProducts=(d&&Array.isArray(d.products))?d.products:(Array.isArray(d)?d:[]);
    }catch(e){console.warn(e);cloudProducts=[]}
  }

  function loadCart(){
    try{const s=localStorage.getItem('store_cart');if(s)cart=JSON.parse(s)||[]}catch(e){cart=[]}
  }
  function saveCart(){
    try{localStorage.setItem('store_cart',JSON.stringify(cart))}catch(e){}
  }

  function renderProducts(){
    if(!cloudProducts.length){
      productGrid.innerHTML='<div class="empty"><i class="fas fa-box-open"></i>暂无商品，敬请期待</div>';
      return;
    }
    let h='';
    cloudProducts.forEach(p=>{
      let m='';
      if(p.mediaType==='video'&&p.mediaData){
        m=`<video src="${p.mediaData}" muted loop playsinline preload="metadata"></video><div class="video-indicator"><i class="fas fa-play"></i> 视频</div>`;
      }else if(p.mediaType==='image'&&p.mediaData){
        m=`<img src="${p.mediaData}" alt="${esc(p.name)}" loading="lazy">`;
      }else{
        m=`<div class="no-media"><i class="fas fa-image"></i>暂无图片</div>`;
      }
      const price=Number(p.price)||0;
      const desc=esc(p.description||'');
      const sd=desc.substring(0,80)+(desc.length>80?'…':'');
      h+=`<div class="product-card">
        <div class="media-preview">${m}</div>
        <div class="product-info">
          <div class="product-name">${esc(p.name)}</div>
          <div class="product-desc">${sd}</div>
          <div class="price-row">
            <span class="price">¥${price.toFixed(2)}</span>
            <button class="add-btn" data-id="${p.id}"><i class="fas fa-cart-plus"></i> 加购</button>
          </div>
        </div>
      </div>`;
    });
    productGrid.innerHTML=h;
    productGrid.querySelectorAll('.add-btn').forEach(b=>{
      b.addEventListener('click',()=>addToCart(b.dataset.id));
    });
  }

  function addToCart(id){
    const p=cloudProducts.find(x=>x.id===id);
    if(!p) return;
    const ex=cart.find(c=>c.id===id);
    if(ex) ex.quantity+=1;
    else cart.push({id:p.id,name:p.name,price:Number(p.price)||0,quantity:1});
    saveCart();updateCartUI();
    toast(`已添加「${p.name}」到购物车`,'','success');
  }

  function updateCartUI(){
    const total=cart.reduce((s,i)=>s+i.quantity,0);
    cartCount.textContent=total;
    if(!cart.length){
      cartList.innerHTML='<li class="empty-cart">购物车空空如也</li>';
      cartTotal.textContent='¥0.00';
      $('checkoutBtn').disabled=true;
      return;
    }
    $('checkoutBtn').disabled=false;
    let h='';
    cart.forEach(i=>{
      h+=`<li>
        <div class="item-info">
          <div class="item-name">${esc(i.name)}</div>
          <div class="item-price">¥${i.price.toFixed(2)} / 件</div>
        </div>
        <div class="item-actions">
          <button class="qty-btn" data-id="${i.id}" data-act="dec">−</button>
          <span class="qty">${i.quantity}</span>
          <button class="qty-btn" data-id="${i.id}" data-act="inc">+</button>
          <button class="rm-btn" data-id="${i.id}" data-act="rm"><i class="fas fa-times"></i></button>
        </div>
      </li>`;
    });
    cartList.innerHTML=h;
    const sum=cart.reduce((s,i)=>s+i.price*i.quantity,0);
    cartTotal.textContent='¥'+sum.toFixed(2);

    cartList.querySelectorAll('.qty-btn').forEach(b=>{
      b.addEventListener('click',()=>{
        const it=cart.find(x=>x.id===b.dataset.id);if(!it) return;
        if(b.dataset.act==='inc') it.quantity+=1;
        else{it.quantity-=1;if(it.quantity<=0)cart=cart.filter(x=>x.id!==it.id)}
        saveCart();updateCartUI();
      });
    });
    cartList.querySelectorAll('.rm-btn').forEach(b=>{
      b.addEventListener('click',()=>{
        cart=cart.filter(x=>x.id!==b.dataset.id);
        saveCart();updateCartUI();
      });
    });
  }

  $('openCartBtn').addEventListener('click',()=>cartDrawer.classList.add('open'));
  $('closeCartBtn').addEventListener('click',()=>cartDrawer.classList.remove('open'));
  $('cancelCheckout').addEventListener('click',()=>checkoutOverlay.classList.remove('show'));
  $('closeFinal').addEventListener('click',()=>checkoutOverlay.classList.remove('show'));
  checkoutOverlay.addEventListener('click',e=>{if(e.target===checkoutOverlay)checkoutOverlay.classList.remove('show')});

  // 点击"去结算"
  $('checkoutBtn').addEventListener('click',()=>{
    if(!cart.length) return toast('购物车是空的','','error');
    let sum=0,h='';
    cart.forEach(i=>{
      const sub=i.price*i.quantity;sum+=sub;
      h+=`<div class="line"><span>${esc(i.name)} × ${i.quantity}</span><span>¥${sub.toFixed(2)}</span></div>`;
    });
    h+=`<div class="line total"><span>总计</span><span>¥${sum.toFixed(2)}</span></div>`;
    orderSummary.innerHTML=h;
    $('checkoutStep1').style.display='';
    $('checkoutStep2').style.display='none';
    checkoutOverlay.classList.add('show');
    cartDrawer.classList.remove('open');
  });

  // 点击"提交订单"
  $('submitOrderBtn').addEventListener('click',async ()=>{
    if(!cart.length) return;

    let sum=0,lines=[];
    cart.forEach(i=>{
      const sub=i.price*i.quantity;sum+=sub;
      lines.push(`${i.name} × ${i.quantity} = ¥${sub.toFixed(2)}`);
    });
    const orderText =
      `【新订单】\n`+
      `\n--- 商品明细 ---\n`+
      lines.join('\n')+
      `\n--- 合计：¥${sum.toFixed(2)} ---\n`+
      `下单时间：${new Date().toLocaleString('zh-CN')}`;

    const btn=$('submitOrderBtn');
    btn.disabled=true;
    btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> 提交中...';

    // ============ 发送到 Web3Forms ============
    let sent=false;
    try{
      const r=await fetch('https://api.web3forms.com/submit',{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({
          access_key: WEB3FORMS_ACCESS_KEY,
          subject: `【新订单】${cart.length} 种商品 - ¥${sum.toFixed(2)}`,
          from_name: '小凯大人的神秘商店',
          order_details: orderText,
          total: `¥${sum.toFixed(2)}`
        })
      });
      if(r.ok){
        const data = await r.json();
        if(data.success) sent = true;
        console.log('Web3Forms 响应:', data);
      }else{
        console.warn('Web3Forms HTTP 错误:', r.status);
      }
    }catch(err){console.warn('Web3Forms 请求失败:', err)}

    btn.disabled=false;
    btn.innerHTML='<i class="fas fa-paper-plane"></i> 提交订单';

    // 展示成功
    $('successDetail').innerHTML =
      `<b>商品：</b>${cart.map(i=>`${esc(i.name)} × ${i.quantity}`).join('，')}<br>`+
      `<b>合计：</b>¥${sum.toFixed(2)}<br>`+
      `<b>时间：</b>${new Date().toLocaleString('zh-CN')}`;

    $('checkoutStep1').style.display='none';
    $('checkoutStep2').style.display='';

    if(sent){
      toast('下单成功，小凯大人竭诚为你服务','','success');
    }else{
      toast('下单成功','','success');
    }
    // 无论成功失败都清空购物车
    cart=[];saveCart();updateCartUI();
  });

  (async()=>{
    loadCart();
    await loadProducts();
    renderProducts();
    updateCartUI();
  })();
})();
</script>
</body>
</html>
