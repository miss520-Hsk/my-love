<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小凯大人的神秘商店</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #f6f8fc;
      padding: 1.5rem 2rem 3rem;
      color: #1e293b;
    }

    .app-wrapper {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      background: linear-gradient(145deg, #0f172a, #334155);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .cart-btn {
      background: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 500;
      font-size: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02), 0 1px 3px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #e2e8f0;
      color: #1e293b;
    }

    .cart-btn:hover {
      background: #f1f5f9;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    .cart-count {
      background: #0f172a;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 950px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .products-section h2,
    .admin-section h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #0f172a;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      border: 1px solid #edf2f7;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.1);
    }

    /* 商品卡片右上角的删除按钮 */
    .delete-product-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      color: #ef4444;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      transition: 0.15s;
      backdrop-filter: blur(4px);
    }

    .delete-product-btn:hover {
      background: #ef4444;
      color: white;
      transform: scale(1.08);
    }

    .media-preview {
      height: 170px;
      background: #f1f5f9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid #eef2f6;
    }

    .media-preview img,
    .media-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-indicator {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 4px 8px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 500;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .no-media {
      color: #94a3b8;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .product-info {
      padding: 1rem 1.2rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
      color: #0f172a;
    }

    .product-desc {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.4;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .price {
      font-weight: 700;
      font-size: 1.2rem;
      color: #0f172a;
    }

    .add-to-cart-btn {
      background: #0f172a;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .add-to-cart-btn:hover {
      background: #1e293b;
    }

    .add-to-cart-btn i {
      font-size: 0.9rem;
    }

    .admin-section {
      background: white;
      border-radius: 1.75rem;
      padding: 1.5rem 1.5rem 2rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.03);
      border: 1px solid #edf2f7;
      position: sticky;
      top: 1.5rem;
    }

    .admin-section h2 {
      margin-bottom: 1.25rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #64748b;
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 1rem;
      font-size: 0.9rem;
      background: #fafcff;
      transition: 0.15s;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #0f172a;
      background: white;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    .media-type-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .media-type-toggle button {
      flex: 1;
      padding: 0.55rem;
      border-radius: 2rem;
      border: 1.5px solid #e2e8f0;
      background: white;
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.1s;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .media-type-toggle button.active {
      background: #0f172a;
      border-color: #0f172a;
      color: white;
    }

    .file-input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-input-wrapper input[type="file"] {
      padding: 0.6rem;
      background: white;
      border: 1.5px dashed #cbd5e1;
      border-radius: 1rem;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .upload-btn {
      width: 100%;
      background: #0f172a;
      color: white;
      border: none;
      padding: 0.9rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: 0.15s;
      margin-top: 0.5rem;
    }

    .upload-btn:hover {
      background: #1e293b;
    }

    .upload-btn i {
      font-size: 1rem;
    }

    .small-note {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.6rem;
      text-align: center;
    }

    .cart-summary {
      background: white;
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      margin-top: 1.5rem;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.02);
      border: 1px solid #edf2f7;
    }

    .cart-summary h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cart-items-list {
      list-style: none;
      font-size: 0.9rem;
    }

    .cart-items-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
      gap: 8px;
    }

    .cart-items-list li:last-child {
      border-bottom: none;
    }

    .cart-item-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .cart-item-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-price {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .qty-btn {
      background: #f1f5f9;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: 0.1s;
    }

    .qty-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .cart-item-qty {
      min-width: 20px;
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .remove-cart-item {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: 0.1s;
      margin-left: 4px;
    }

    .remove-cart-item:hover {
      background: #fee2e2;
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1rem;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 2px solid #e2e8f0;
      color: #0f172a;
    }

    .clear-cart-btn {
      width: 100%;
      margin-top: 10px;
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 0.55rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .clear-cart-btn:hover {
      background: #fecaca;
    }

    .empty-cart-msg {
      color: #94a3b8;
      font-size: 0.85rem;
      font-style: italic;
      justify-content: center;
    }

    .toast-message {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 50px;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 999;
    }

    .toast-message.show {
      opacity: 1;
    }

    .toast-message.error {
      background: #b91c1c;
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <header>
    <h1><i class="fas fa-store" style="margin-right: 10px; background: none; -webkit-text-fill-color: #0f172a;"></i>灵感商店</h1>
    <button class="cart-btn" id="cartButton">
      <i class="fas fa-shopping-bag"></i> 购物车
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <div class="main-layout">
    <div class="products-section">
      <h2><i class="fas fa-box-open" style="color: #0f172a;"></i> 全部商品</h2>
      <div class="product-grid" id="productGrid"></div>
    </div>

    <div class="admin-section">
      <h2><i class="fas fa-cloud-upload-alt"></i> 后台上传商品</h2>
      <form id="uploadForm">
        <div class="form-group">
          <label>商品名称</label>
          <input type="text" id="productName" placeholder="例如：手工陶瓷杯" required>
        </div>
        <div class="form-group">
          <label>商品介绍</label>
          <textarea id="productDesc" placeholder="描述一下商品的特点、材质等..." required></textarea>
        </div>
        <div class="form-group">
          <label>价格 (¥)</label>
          <input type="number" id="productPrice" step="0.01" min="0.01" placeholder="99.00" required>
        </div>

        <div class="form-group">
          <label>商品媒体 (图片或视频)</label>
          <div class="media-type-toggle" id="mediaToggle">
            <button type="button" data-type="image" class="active"><i class="fas fa-image"></i> 图片</button>
            <button type="button" data-type="video"><i class="fas fa-video"></i> 视频</button>
          </div>
          <div class="file-input-wrapper">
            <input type="file" id="mediaFile" accept="image/*">
          </div>
          <div class="small-note">支持 JPG, PNG, GIF, MP4, WebM 等</div>
        </div>

        <button type="submit" class="upload-btn"><i class="fas fa-plus-circle"></i> 上架商品</button>
      </form>

      <div class="cart-summary" id="cartSummary">
        <h3><i class="fas fa-shopping-cart"></i> 购物车摘要</h3>
        <ul class="cart-items-list" id="cartItemsList"></ul>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast-message">已添加到购物车</div>

<script>
  (function() {
    let products = [];
    let cart = [];

    const defaultProducts = [
      {
        id: 'p1',
        name: '极简陶瓷杯',
        description: '手工制作，哑光釉面，容量350ml，温暖你的每个早晨。',
        price: 89.00,
        mediaType: 'image',
        mediaData: 'https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=400&auto=format&fit=crop&q=60',
        mediaMime: null
      },
      {
        id: 'p2',
        name: '无线降噪耳机',
        description: '主动降噪，40小时续航，舒适佩戴，沉浸式听觉体验。',
        price: 499.00,
        mediaType: 'image',
        mediaData: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&auto=format&fit=crop&q=60',
        mediaMime: null
      },
      {
        id: 'p3',
        name: '植物精油香薰',
        description: '薰衣草与雪松混合，舒缓情绪，改善睡眠。含视频介绍。',
        price: 129.00,
        mediaType: 'video',
        mediaData: 'https://assets.mixkit.co/videos/preview/mixkit-candle-flame-in-the-dark-1218-large.mp4',
        mediaMime: 'video/mp4'
      }
    ];

    function loadFromStorage() {
      const storedProducts = localStorage.getItem('store_products');
      const storedCart = localStorage.getItem('store_cart');
      if (storedProducts) {
        try { products = JSON.parse(storedProducts); } catch (e) { products = [...defaultProducts]; }
      } else {
        products = [...defaultProducts];
      }
      if (storedCart) {
        try { cart = JSON.parse(storedCart); } catch (e) { cart = []; }
      } else {
        cart = [];
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem('store_products', JSON.stringify(products));
        localStorage.setItem('store_cart', JSON.stringify(cart));
      } catch (e) {
        console.warn('存储失败', e);
      }
    }

    const productGrid = document.getElementById('productGrid');
    const cartCountSpan = document.getElementById('cartCount');
    const cartItemsList = document.getElementById('cartItemsList');
    const uploadForm = document.getElementById('uploadForm');
    const mediaToggle = document.getElementById('mediaToggle');
    const mediaFileInput = document.getElementById('mediaFile');
    const toastEl = document.getElementById('toast');
    const cartButton = document.getElementById('cartButton');

    let currentMediaType = 'image';

    function showToast(msg, duration = 2000, isError = false) {
      toastEl.textContent = msg;
      toastEl.classList.toggle('error', isError);
      toastEl.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, duration);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============ 渲染商品 ============
    function renderProducts() {
      if (!productGrid) return;
      if (products.length === 0) {
        productGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem; color:#94a3b8;">
          <i class="fas fa-box-open" style="font-size:2rem; margin-bottom:8px; display:block;"></i>
          暂无商品，请在后台上传
        </div>`;
        return;
      }

      let html = '';
      products.forEach(prod => {
        let mediaHtml = '';
        if (prod.mediaType === 'video' && prod.mediaData) {
          mediaHtml = `
            <video src="${prod.mediaData}" muted loop playsinline preload="metadata"></video>
            <div class="video-indicator"><i class="fas fa-play"></i> 视频</div>
          `;
        } else if (prod.mediaType === 'image' && prod.mediaData) {
          mediaHtml = `<img src="${prod.mediaData}" alt="${escapeHtml(prod.name)}" loading="lazy">`;
        } else {
          mediaHtml = `<div class="no-media"><i class="fas fa-image" style="font-size:2rem;"></i> 暂无媒体</div>`;
        }

        const safeName = escapeHtml(prod.name);
        const safeDesc = escapeHtml(prod.description).substring(0, 80) + (prod.description.length > 80 ? '…' : '');

        html += `
          <div class="product-card" data-id="${prod.id}">
            <button class="delete-product-btn" data-id="${prod.id}" title="删除商品">
              <i class="fas fa-trash-alt"></i>
            </button>
            <div class="media-preview">
              ${mediaHtml}
            </div>
            <div class="product-info">
              <div class="product-name">${safeName}</div>
              <div class="product-desc">${safeDesc}</div>
              <div class="price-row">
                <span class="price">¥${prod.price.toFixed(2)}</span>
                <button class="add-to-cart-btn" data-id="${prod.id}"><i class="fas fa-cart-plus"></i> 加购</button>
              </div>
            </div>
          </div>
        `;
      });

      productGrid.innerHTML = html;

      // 加购按钮
      document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          addToCart(btn.dataset.id);
        });
      });

      // 删除商品按钮
      document.querySelectorAll('.delete-product-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteProduct(btn.dataset.id);
        });
      });
    }

    // ============ 删除已上架商品 ============
    function deleteProduct(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const confirmed = confirm(`确定要删除商品「${product.name}」吗？\n\n删除后无法恢复。`);
      if (!confirmed) return;

      // 从商品列表移除
      products = products.filter(p => p.id !== productId);

      // 同时从购物车里移除该商品
      const hadInCart = cart.some(item => item.id === productId);
      if (hadInCart) {
        cart = cart.filter(item => item.id !== productId);
      }

      saveToStorage();
      renderProducts();
      updateCartUI();

      showToast(`已删除商品「${product.name}」${hadInCart ? '，并已从购物车移除' : ''}`);
    }

    // ============ 添加到购物车 ============
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          price: product.price,
          quantity: 1
        });
      }

      updateCartUI();
      saveToStorage();
      showToast(`已添加「${product.name}」到购物车`);
    }

    // ============ 从购物车移除单个商品 ============
    function removeCartItem(productId) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;

      if (item.quantity > 1) {
        // 数量大于1，减少数量
        item.quantity -= 1;
        showToast(`「${item.name}」数量减为 ${item.quantity}`);
      } else {
        // 数量为1，直接移除
        cart = cart.filter(i => i.id !== productId);
        showToast(`已从购物车移除「${item.name}」`);
      }

      updateCartUI();
      saveToStorage();
    }

    // ============ 完全移除购物车某项（无论数量） ============
    function removeCartItemCompletely(productId) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;

      const confirmed = confirm(`确定要从购物车移除「${item.name}」吗？`);
      if (!confirmed) return;

      cart = cart.filter(i => i.id !== productId);
      updateCartUI();
      saveToStorage();
      showToast(`已从购物车移除「${item.name}」`);
    }

    // ============ 清空购物车 ============
    function clearCart() {
      if (cart.length === 0) return;
      const confirmed = confirm('确定要清空购物车吗？');
      if (!confirmed) return;

      cart = [];
      updateCartUI();
      saveToStorage();
      showToast('购物车已清空');
    }

    // ============ 更新购物车 UI ============
    function updateCartUI() {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartCountSpan.textContent = totalItems;

      if (!cartItemsList) return;

      if (cart.length === 0) {
        cartItemsList.innerHTML = '<li class="empty-cart-msg">购物车还是空的</li>';
        return;
      }

      let listHtml = '';
      cart.forEach(item => {
        listHtml += `
          <li>
            <div class="cart-item-info">
              <span class="cart-item-name">${escapeHtml(item.name)}</span>
              <span class="cart-item-price">¥${item.price.toFixed(2)} / 件</span>
            </div>
            <div class="cart-item-actions">
              <button class="qty-btn" data-id="${item.id}" data-action="decrease" title="减少数量">−</button>
              <span class="cart-item-qty">${item.quantity}</span>
              <button class="qty-btn" data-id="${item.id}" data-action="increase" title="增加数量">+</button>
              <button class="remove-cart-item" data-id="${item.id}" title="移除">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </li>
        `;
      });

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      listHtml += `<li class="cart-total-row"><span>总计</span><span>¥${total.toFixed(2)}</span></li>`;
      listHtml += `<li style="border:none; padding:0;"><button class="clear-cart-btn" id="clearCartBtn"><i class="fas fa-trash-alt"></i> 清空购物车</button></li>`;

      cartItemsList.innerHTML = listHtml;

      // 给数量减按钮绑定事件
      cartItemsList.querySelectorAll('.qty-btn[data-action="decrease"]').forEach(btn => {
        btn.addEventListener('click', () => removeCartItem(btn.dataset.id));
      });

      // 给数量加按钮绑定事件
      cartItemsList.querySelectorAll('.qty-btn[data-action="increase"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const item = cart.find(i => i.id === id);
          if (item) {
            item.quantity += 1;
            updateCartUI();
            saveToStorage();
          }
        });
      });

      // 给移除按钮绑定事件
      cartItemsList.querySelectorAll('.remove-cart-item').forEach(btn => {
        btn.addEventListener('click', () => removeCartItemCompletely(btn.dataset.id));
      });

      // 给清空按钮绑定事件
      const clearBtn = document.getElementById('clearCartBtn');
      if (clearBtn) {
        clearBtn.addEventListener('click', clearCart);
      }
    }

    // 购物车按钮点击
    cartButton.addEventListener('click', () => {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      if (totalItems === 0) {
        showToast('购物车是空的，快去挑选商品吧');
      } else {
        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2);
        showToast(`购物车共 ${totalItems} 件商品，总计 ¥${totalPrice}`, 3000);
      }
    });

    // 媒体类型切换
    mediaToggle.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const type = btn.dataset.type;
      if (!type) return;

      mediaToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMediaType = type;

      if (type === 'image') {
        mediaFileInput.accept = 'image/*';
      } else {
        mediaFileInput.accept = 'video/*';
      }
      mediaFileInput.value = '';
    });

    // 上传表单
    uploadForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('productName').value.trim();
      const desc = document.getElementById('productDesc').value.trim();
      const price = parseFloat(document.getElementById('productPrice').value);

      if (!name || !desc || isNaN(price) || price <= 0) {
        alert('请完整填写商品名称、介绍和有效价格');
        return;
      }

      const file = mediaFileInput.files[0];

      const addProduct = (mediaData, mediaMime) => {
        let mediaType = currentMediaType;
        if (file) {
          if (file.type.startsWith('video/')) mediaType = 'video';
          else if (file.type.startsWith('image/')) mediaType = 'image';
        }

        const newProduct = {
          id: 'p' + Date.now() + Math.random().toString(36).substring(2, 6),
          name: name,
          description: desc,
          price: price,
          mediaType: mediaType,
          mediaData: mediaData,
          mediaMime: mediaMime
        };

        products.push(newProduct);
        saveToStorage();
        renderProducts();
        uploadForm.reset();
        mediaToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        mediaToggle.querySelector('button[data-type="image"]').classList.add('active');
        currentMediaType = 'image';
        mediaFileInput.accept = 'image/*';
        showToast(`商品「${name}」上架成功`);
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          addProduct(event.target.result, file.type);
        };
        reader.readAsDataURL(file);
      } else {
        addProduct(null, null);
      }
    });

    function init() {
      loadFromStorage();
      if (!products || products.length === 0) {
        products = [...defaultProducts];
        saveToStorage();
      }
      renderProducts();
      updateCartUI();

      mediaToggle.querySelector('button[data-type="image"]').classList.add('active');
      mediaToggle.querySelector('button[data-type="video"]').classList.remove('active');
      currentMediaType = 'image';
      mediaFileInput.accept = 'image/*';
    }

    init();

    window.addEventListener('beforeunload', () => {
      saveToStorage();
    });
  })();
</script>
</body>
</html>
